<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cLeft1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cRight1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="cLeft2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cRight2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Badge -->
  <rect x="8" y="8" width="224" height="224" rx="48" fill="url(#iconBg)"/>
  <rect x="12" y="12" width="216" height="216" rx="44" fill="none" stroke="url(#cGold)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- 3-Layer Perspective Chevron Mark -->
  <g transform="translate(0, 8)">
    <!-- Layer 1 -->
    <polygon points="32,56 102,88 102,114 32,82" fill="url(#cLeft1)"/>
    <polygon points="102,88 208,44 208,70 102,114" fill="url(#cRight1)"/>

    <!-- Layer 2 -->
    <polygon points="32,96 102,128 102,154 32,122" fill="url(#cLeft2)"/>
    <polygon points="102,128 208,84 208,110 102,154" fill="url(#cRight2)"/>

    <!-- Layer 3 -->
    <polygon points="32,136 102,168 102,194 32,162" fill="#1e40af"/>
    <polygon points="102,168 208,124 208,150 102,194" fill="#60a5fa"/>

    <!-- Gold Architectural Base Line -->
    <polygon points="32,168 102,200 102,208 32,176" fill="#d97706"/>
    <polygon points="102,200 208,156 208,164 102,208" fill="url(#cGold)"/>

    <!-- Center 3D Fold Highlight -->
    <line x1="102" y1="88" x2="102" y2="208" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
  </g>
</svg>
